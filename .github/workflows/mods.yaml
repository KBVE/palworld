name: mods

on:
  push:
    branches: [main]
    paths: ['mods/**', '.github/workflows/mods.yaml']
  pull_request:
    paths: ['mods/**', '.github/workflows/mods.yaml']

# Checks never write; the default token scope is wider than needed.
permissions:
  contents: read

concurrency:
  group: mods-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chef:
    # The only mod with a build step: python that generates placeholder art
    # and validates the food TOMLs.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods/chef_paldon_yumsay/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mods/chef_paldon_yumsay/build/requirements.txt
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Test
        run: python -m pytest -q

  lua:
    # No Lua runtime in the mod loader's shape here, so this is a syntax
    # gate rather than a test suite — enough to catch a broken script
    # before it reaches a live server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install luac
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Syntax check
        run: |
          FAILED=0
          while IFS= read -r f; do
            luac5.4 -p "$f" || { echo "::error file=$f::lua syntax error"; FAILED=1; }
          done < <(find mods -name '*.lua')
          exit $FAILED

  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate JSON
        run: |
          FAILED=0
          while IFS= read -r f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid JSON"; FAILED=1; }
          done < <(find mods -name '*.json')
          exit $FAILED
