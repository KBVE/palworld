name: savetool

on:
  push:
    branches: [main]
    paths: ['savetool/**', '.github/workflows/savetool.yaml']
  pull_request:
    paths: ['savetool/**', '.github/workflows/savetool.yaml']

permissions:
  contents: read

concurrency:
  group: savetool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: savetool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # save_intel.py imports PalworldSaveTools lazily, inside the
      # functions that parse saves, so the tests run on the standard
      # library alone. Installing requirements.txt here would clone a
      # pinned git dependency and compile it for no benefit, and would
      # fail whenever that upstream is unreachable.
      - name: Install pytest
        run: pip install pytest

      - name: Test
        run: python -m pytest -q
