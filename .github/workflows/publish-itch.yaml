name: publish-itch

# Version-driven, not commit-driven. map/package.json holds the version;
# bumping it is what publishes. Everything else on main is a no-op here,
# so build names on itch are versions rather than commit hashes.
on:
  push:
    branches: [main]
    paths: ['map/**', '.github/workflows/publish-itch.yaml']
  workflow_dispatch:

concurrency:
  group: publish-itch
  cancel-in-progress: false

env:
  ITCH_USER: kbve
  ITCH_GAME: palworld-map
  CHANNEL: html5

jobs:
  check:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/github-script@v7
        id: read
        with:
          script: |
            const fs = require('fs')
            const { version } = JSON.parse(fs.readFileSync('map/package.json', 'utf8'))
            if (!version) {
              core.setFailed('map/package.json has no version field')
              return
            }
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              core.setFailed(`version "${version}" is not a bare x.y.z semver`)
              return
            }
            core.setOutput('version', version)

            // Republishing a version already on itch overwrites a build
            // people may already be playing, so an existing tag means stop.
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/map-v${version}`,
              })
              core.notice(`map-v${version} is already published — bump the version to release again.`)
              core.setOutput('publish', 'false')
            } catch (error) {
              if (error.status !== 404) throw error
              core.setOutput('publish', 'true')
            }

  publish:
    name: Publish v${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: map
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Require butler credentials
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API }}
        run: |
          if [ -z "${BUTLER_API_KEY}" ]; then
            echo "::error::ITCH_API resolved empty - check the KBVE org secret's repository visibility."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate assets
        run: python3 e2e/validate_assets.py

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: map/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: map/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm test:e2e

      # itch enforces a 1000-file cap when it processes the upload, not
      # when butler pushes it. Without this guard a publish "succeeds" and
      # the store page is broken.
      - name: Verify itch constraints
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          COUNT=$(find dist -type f | wc -l | tr -d ' ')
          echo "dist files: $COUNT"
          if [ "$COUNT" -gt 1000 ]; then
            echo "::error::dist has $COUNT files, over itch's 1000 cap."
            echo "::error::Tiles must ship as PMTiles archives, not loose files."
            exit 1
          fi

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API }}
        run: |
          "$RUNNER_TEMP/butler/butler" push dist \
            "${ITCH_USER}/${ITCH_GAME}:${CHANNEL}" --userversion "${VERSION}"

      - name: Tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: map-v${{ needs.check.outputs.version }}
          name: Palworld Map v${{ needs.check.outputs.version }}
          generate_release_notes: true
          body: |
            Live at https://kbve.itch.io/palworld-map
