name: ci

on:
  push:
    branches: [main]
    paths: ['map/**', '.github/workflows/ci.yaml']
  pull_request:
    paths: ['map/**', '.github/workflows/ci.yaml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map:
    # Scoped to map/ so a server or mod change never rebuilds the map, and
    # a tile change never touches the server images.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: map
    steps:
      - uses: actions/checkout@v5

      # Asset validation is stdlib python and needs no node, so it runs
      # first and fails fast on broken icons or out-of-bounds POIs.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate assets
        run: python3 e2e/validate_assets.py

      # working-directory applies to run steps only, so this action needs
      # the path to package.json spelled out.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: map/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: map/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: map/playwright-report/
          retention-days: 7
