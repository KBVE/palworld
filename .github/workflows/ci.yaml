name: ci

on:
  push:
    branches: [main]
    paths: ['map/**', '.github/workflows/ci.yaml']
  pull_request:
    paths: ['map/**', '.github/workflows/ci.yaml']

# Checks never write; the default token scope is wider than needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map:
    # Scoped to map/ so a server or mod change never rebuilds the map, and
    # a tile change never touches the server images.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: map
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # first and fails fast on broken icons or out-of-bounds POIs.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate assets
        run: python3 e2e/validate_assets.py

      # working-directory applies to run steps only, so this action needs
      # the path to package.json spelled out.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: map/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: map/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Chromium is ~150 MB per run without this.
      - name: Cache playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('map/pnpm-lock.yaml') }}
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: map/playwright-report/
          retention-days: 7
